<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetVet</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Soft background blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: blobPulse 6s ease-in-out infinite alternate;
    }
    .blob-1 {
      width: 420px; height: 420px;
      background: #6EE7B7;
      top: -120px; left: -100px;
      animation-delay: 0s;
    }
    .blob-2 {
      width: 320px; height: 320px;
      background: #A7F3D0;
      bottom: -80px; right: -80px;
      animation-delay: 1.5s;
    }
    .blob-3 {
      width: 200px; height: 200px;
      background: #34D399;
      top: 60%; left: 10%;
      animation-delay: 3s;
    }

    @keyframes blobPulse {
      from { transform: scale(1) translate(0, 0); }
      to   { transform: scale(1.12) translate(15px, -10px); }
    }

    /* Floating paw prints in background */
    .paw-bg {
      position: absolute;
      font-size: 28px;
      opacity: 0.07;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.07; }
      90%  { opacity: 0.07; }
      to   { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
    }

    /* Center content */
    .splash-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Icon container with glow ring */
    .icon-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.5) translateY(20px);
      animation: iconPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    }

    .glow-ring {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #6EE7B7, #34D399, #A7F3D0, #6EE7B7
      );
      opacity: 0;
      filter: blur(18px);
      animation: glowFade 1.2s ease 1s forwards;
    }

    .icon-bg {
      position: absolute;
      inset: 0;
      border-radius: 42px;
      background: linear-gradient(145deg, #f0fdf9, #d1fae5);
      box-shadow:
        0 20px 60px rgba(52, 211, 153, 0.25),
        0 4px 16px rgba(52, 211, 153, 0.15),
        inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .icon-wrap img {
      position: relative;
      z-index: 2;
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 6px 18px rgba(52, 211, 153, 0.4));
    }

    @keyframes iconPop {
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes glowFade {
      to { opacity: 0.5; }
    }

    /* App name */
    .app-name {
      margin-top: 28px;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #059669 0%, #10b981 40%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      transform: translateY(18px);
      animation: slideUp 0.7s ease 1.1s forwards;
    }

    /* Tagline */
    .tagline {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #9CA3AF;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(12px);
      animation: slideUp 0.7s ease 1.4s forwards;
    }

    /* Loading dots */
    .dots {
      margin-top: 48px;
      display: flex;
      gap: 8px;
      opacity: 0;
      animation: slideUp 0.5s ease 1.8s forwards;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34D399;
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: #6EE7B7; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #A7F3D0; }

    @keyframes dotBounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50%       { transform: translateY(-8px); opacity: 1; }
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Floating background paw prints -->
  <script>
    const pawEmoji = '🐾';
    for (let i = 0; i < 10; i++) {
      const el = document.createElement('div');
      el.className = 'paw-bg';
      el.textContent = pawEmoji;
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (12 + Math.random() * 16) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      el.style.fontSize = (18 + Math.random() * 24) + 'px';
      document.body.appendChild(el);
    }
  </script>

  <!-- Main splash content -->
  <div class="splash-center">
    <div class="icon-wrap">
      <div class="glow-ring"></div>
      <div class="icon-bg"></div>
      <img src="./app-icon.png" alt="PetVet" />
    </div>

    <div class="app-name">PetVet</div>
    <div class="tagline">Your pet's best friend</div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</body>
</html>
